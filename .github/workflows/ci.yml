name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test ./...
      - run: go vet ./...
      - name: Build and start Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/redmine-gitlab-mcp ./cmd/redmine-gitlab-mcp
          ./dist/redmine-gitlab-mcp --version
