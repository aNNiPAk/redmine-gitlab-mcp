name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Build and package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          go build -trimpath -ldflags='-s -w' -o dist/package/redmine-gitlab-mcp.exe ./cmd/redmine-gitlab-mcp
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install.ps1 -Binary dist/package/redmine-gitlab-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install-online.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Online installer tests failed' }
          $version = & ./dist/package/redmine-gitlab-mcp.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Binary failed to start' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") {
            throw "Tag must match the binary version v$version"
          }
          Copy-Item README.md, install.ps1, configure.ps1 dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/redmine-gitlab-mcp-windows-amd64.zip
          $hash = (Get-FileHash dist/redmine-gitlab-mcp-windows-amd64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist/SHA256SUMS', "$hash  redmine-gitlab-mcp-windows-amd64.zip`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: redmine-gitlab-mcp-windows-amd64
          path: |
            dist/redmine-gitlab-mcp-windows-amd64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package Linux binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/package/redmine-gitlab-mcp ./cmd/redmine-gitlab-mcp
          version=$(./dist/package/redmine-gitlab-mcp --version)
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag must match the binary version v$version" >&2
            exit 1
          fi

          config=$(mktemp)
          trap 'unlink "$config"' EXIT
          cat > "$config" <<'JSON'
          {"redmineUrl":"http://127.0.0.1:1","redmineApiKey":"test","gitlabUrl":"http://127.0.0.1:1","gitlabToken":"test","gitlabProject":"dev/server"}
          JSON
          ./dist/package/redmine-gitlab-mcp --config "$config" <<'JSON' | jq -es --arg version "$version" '
            length == 2 and
            (.[0] | .id == 1 and .result.protocolVersion == "2025-06-18" and .result.serverInfo.version == $version) and
            (.[1] | .id == 2 and any(.result.tools[]; .name == "get_issue")) and
            all(.[]; .jsonrpc == "2.0" and (has("error") | not))
          '
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          JSON

          cp README.md dist/package/
          cd dist
          tar -czf redmine-gitlab-mcp-linux-amd64.tar.gz -C package redmine-gitlab-mcp README.md
          sha256sum redmine-gitlab-mcp-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: redmine-gitlab-mcp-linux-amd64
          path: |
            dist/redmine-gitlab-mcp-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: redmine-gitlab-mcp-windows-amd64
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: redmine-gitlab-mcp-linux-amd64
          path: dist/linux
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          mv windows/redmine-gitlab-mcp-windows-amd64.zip linux/redmine-gitlab-mcp-linux-amd64.tar.gz .
          cat windows/SHA256SUMS linux/SHA256SUMS > SHA256SUMS
          sha256sum --strict -c SHA256SUMS
          gh release create "$TAG" redmine-gitlab-mcp-windows-amd64.zip redmine-gitlab-mcp-linux-amd64.tar.gz SHA256SUMS --verify-tag --generate-notes
